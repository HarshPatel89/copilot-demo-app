<div class="card">
    <div class="flex justify-content-between mb-3">
        <h2>Customers</h2>
        <p-button label="Add Customer" icon="pi pi-plus" (onClick)="openAddCustomerModal()"></p-button>
    </div>

    <p-table [value]="customers" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="10" 
        [globalFilterFields]="['name', 'email']" [loading]="isLoading">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
                <th>Prime Member</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-customer>
            <tr>
                <td>{{customer.name}}</td>
                <td>{{customer.email}}</td>
                <td>
                    <i [class]="customer.isPrimeMember ? 'pi pi-check-circle text-green' : 'pi pi-times-circle text-red'"></i>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" severity="success" (onClick)="openEditCustomerModal(customer)"></p-button>
                        <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteCustomer(customer.id)"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog 
    [(visible)]="isCustomerModalVisible" 
    [header]="isEditMode ? 'Edit Customer' : 'Add Customer'" 
    [modal]="true" 
    [style]="{width: '450px'}"
    (onHide)="closeCustomerModal()">
    <ng-template pTemplate="content">
        <app-add *ngIf="!isEditMode" (customerSaved)="closeCustomerModal()"></app-add>
        <app-update 
            *ngIf="isEditMode && selectedCustomer"
            [customer]="selectedCustomer"
            (customerUpdated)="closeCustomerModal()">
        </app-update>
    </ng-template>
</p-dialog>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
